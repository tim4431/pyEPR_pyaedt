name: Greetings

on: [pull_request_target, issues]

# The default GITHUB_TOKEN is read-only; first-interaction needs write access to
# post the welcome comment (otherwise: "Resource not accessible by integration").
permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: '👏👏👏 You are awesome! Thank you for making your first issue to pyEPR '' first issue'
        pr-message: '👏👏👏 You are awesome! Thank you for making your first pull request to pyEPR! This team work makes the pyEPR dream work! '' first pr'
