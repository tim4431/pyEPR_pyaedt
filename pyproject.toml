[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyEPR-pyaedt"
dynamic = ["version"]
description = "Python Energy-Participation-Ratio (EPR) package for quantum chip design"
readme = { file = "README.md", content-type = "text/markdown" }
license = "BSD-3-Clause"
authors = [
    { name = "Zlatko K. Minev", email = "zlatko.minev@aya.yale.edu" },
    { name = "tim4431" },
]
maintainers = [
    { name = "tim4431" },
    { name = "Zlatko Minev", email = "zlatko.minev@aya.yale.edu" },
    { name = "pyEPR team" },
]
requires-python = ">=3.10, <4"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Environment :: Console",
]
dependencies = [
    "addict",
    "ipython>=7.0.0",
    "matplotlib>=3.1.0",
    "numpy>=1.15.0",
    "pandas>=1.0.1",
    "pint>=0.8",
    "qutip>=5.0.0",
    "scipy>=1.3.0",
    "seaborn>=0.10.0",
    "sympy>=1.3",
    "xarray>=0.10.0",
]

[project.urls]
Homepage = "https://github.com/tim4431/pyEPR_pyaedt"
Repository = "https://github.com/tim4431/pyEPR_pyaedt"
Issues = "https://github.com/tim4431/pyEPR_pyaedt/issues"
"Upstream (pyEPR)" = "https://github.com/zlatko-minev/pyEPR"
Documentation = "https://pyepr-docs.readthedocs.io/en/latest/"

[tool.setuptools.dynamic]
version = { attr = "pyEPR_pyaedt.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["pyEPR_pyaedt*"]

[project.optional-dependencies]
docs = [
    "sphinx>=4.0",
    "pydata-sphinx-theme",
    "sphinx-design",
    "myst-nb",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
]
# PyAEDT — Ansys' official Python interface to AEDT/HFSS. Required only for the
# live-HFSS field-extraction path (connecting to a running Ansys session); the
# numerical / no-HFSS analysis path and `solution_types`/`calcs` do NOT need it.
# `ansys-aedt-core` provides the `ansys.aedt.core` import path used here
# (validated against 0.26.1 with AEDT 2025 R2). The legacy top-level `pyaedt`
# distribution is also accepted at runtime as a fallback.
aedt = [
    "ansys-aedt-core",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not hfss'"
markers = [
    "hfss: marks tests that require a live Ansys HFSS connection (skipped in CI)",
]
